<ion-card class="builder__questions-card">
    <ion-card-header class="builder__panel-heading builder__questions-header">
        <div class="builder__questions-heading">
            <ion-card-title class="builder__panel-title builder__questions-title">
                <span class="builder__questions-title-prefix">Form</span><span class="builder__questions-title-sep" aria-hidden="true"> &gt; </span><span class="builder__questions-title-name"></span>
            </ion-card-title>

            <div class="builder__heading-actions builder__answers-btn-group builder__form-actions-group">
                <button type="button"
                        class="builder__answers-more-btn builder__form-action-btn builder__form-action-btn--delete"
                        aria-label="Delete form"
                        title="Deleting a form is not ported yet"
                        disabled>
                    <ion-icon name="trash-outline"
                              aria-hidden="true"></ion-icon>
                </button>
                <button type="button"
                        class="builder__answers-more-btn builder__form-action-btn builder__form-action-btn--edit"
                        aria-label="Edit form name"
                        title="Renaming a form is not ported yet"
                        disabled>
                    <ion-icon name="create-outline"
                              aria-hidden="true"></ion-icon>
                </button>
                <button type="button"
                        class="builder__answers-more-btn builder__form-action-btn builder__form-action-btn--more"
                        aria-label="Form actions"
                        title="Form actions are not ported yet"
                        disabled>
                    <ion-icon name="chevron-down-outline"
                              aria-hidden="true"></ion-icon>
                </button>
            </div>
        </div>
    </ion-card-header>

    <ion-card-content class="builder__questions-content">
        <ion-list class="builder__question-list">
            <div class="builder__empty">No questions in this form yet.</div>
        </ion-list>
    </ion-card-content>
</ion-card>
