<div class="builder__csv-import">
    <ion-grid class="builder__csv-dataset-grid"
              data-role="csv-column-row">
        <ion-row class="ion-align-items-center">
            <ion-col size="8">
                <label>Select which dataset to import</label>
            </ion-col>
            <ion-col size="4">
                <div class="dropdown builder__csv-column"
                     data-role="csv-column"
                     aria-label="Column to import"></div>
            </ion-col>
        </ion-row>
    </ion-grid>

    <hr>

    <ion-checkbox justify="start" class="builder__checkbox"
                  label-placement="end"
                  data-role="csv-headers"
                  checked>
        <span>First row contains headers</span>
    </ion-checkbox>

    <hr>

    <ion-radio-group class="builder__radio-group builder__csv-mode"
                     data-role="csv-mode"
                     value="replace">
        <ion-radio justify="start" value="replace"
                   label-placement="end">
            <span>Replace all existing possible answers</span>
        </ion-radio>
        <ion-radio justify="start" value="append"
                   label-placement="end">
            <span>Append to existing possible answers</span>
        </ion-radio>
    </ion-radio-group>
</div>
