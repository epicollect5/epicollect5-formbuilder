<hr>
<div class="input-properties__form__possible-answers panel panel-default">
    <div class="panel-heading">
        <strong>Possible answers</strong>

        <div class="btn-group pull-right">
            <button type="button"
                    class="input-properties__form__possible-answers__add-answer btn btn-default btn-sm"
                    {{disabled}}>
                <i class="fa fa-plus fa-2x fa-fw"
                   aria-hidden="true"></i>
                Add answer
            </button>
            <button type="button"
                    class="input-properties__form__possible-answers__more btn btn-default btn-sm dropdown-toggle"
                    data-toggle="dropdown"
                    aria-haspopup="true"
                    aria-expanded="false"
                    aria-label="More possible answer actions">
                <span class="caret"
                      aria-hidden="true"></span>
            </button>
            <ul class="dropdown-menu"
                role="menu">
                <li class="dropdown-header text-center text-warning">Currently in beta.</li>
                <li class="possible_answer-more-action possible_answers__import-csv"
                    role="presentation">
                    <input type="file"
                           class="possible_answers__import-csv-input-file"
                           style="display:none"
                           accept=".csv">
                    <a href="#"
                       role="menuitem">Import CSV</a>
                </li>
                <li class="possible_answer-more-action possible_answers__export-csv"
                    role="presentation">
                    <a href="#"
                       role="menuitem">Export CSV</a>
                </li>

                <li role="separator"
                    class="divider"></li>
                <li class="text-center text-branding">Order</li>
                <li class="possible_answer-more-action possible_answers__order-az"
                    role="presentation">
                    <a href="#"
                       role="menuitem">Ascending</a>
                </li>
                <li class="possible_answer-more-action possible_answers__order-za"
                    role="presentation">
                    <a href="#"
                       role="menuitem">Descending</a>
                </li>
                <li class="possible_answer-more-action possible_answers__order-shuffle"
                    role="presentation">
                    <a href="#"
                       role="menuitem">Shuffle</a>
                </li>
                <li role="separator"
                    class="divider"></li>
                <li class="possible_answer-more-action possible_answers__delete-all"
                    role="presentation">
                    <a href="#"
                       role="menuitem">Delete all answers</a>
                </li>
            </ul>
        </div>
    </div>
    <div class="panel-body">
        <ul class="input-properties__form__possible-answers__list list-group">
            {{possible-answers-list}}
        </ul>
    </div>
    <div>
        <ul class="pager hidden possible-answers__list_pager">
            <li>
                <a class="possible-answers__list_pager__prev"
                   href="#"
                   aria-label="Previous page">
                    <i class="fa fa-chevron-left"
                       aria-hidden="true"></i>
                </a>
            </li>
            <li>
                <div class="possible-answers__list_pager__current">1</div>
                /
                <div class="possible-answers__list_pager__total">10</div>
            </li>
            <li>
                <a class="possible-answers__list_pager__next"
                   href="#"
                   aria-label="Next page">
                    <i class="fa fa-chevron-right"
                       aria-hidden="true"></i>
                </a>
            </li>
        </ul>
    </div>
</div>
