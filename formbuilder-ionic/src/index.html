<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Formbuilder — Ionic</title>
    <meta name="description"
          content="Ionic formbuilder for the Epicollect5 project definition">

    <link rel="shortcut icon"
          href="favicons/favicon.ico">
    <link rel="icon"
          type="image/svg+xml"
          href="favicons/favicon.svg">
    <link rel="apple-touch-icon"
          sizes="96x96"
          href="favicons/favicon-96x96.png">

    <link href="https://fonts.googleapis.com/css?family=Arimo"
          rel="stylesheet"
          type="text/css">

    <!-- Ionic Core 8.8.4 (pinned, copied into vendor/ionic by the build) -->
    <link rel="stylesheet"
          href="vendor/ionic/css/ionic.bundle.css">
    <link rel="stylesheet"
          href="css/ionic-formbuilder.css">
</head>

<body class="loader-background">
<ion-app>
    <div class="loader">Loading...</div>

    <ion-header>
        <ion-toolbar color="primary">
            <ion-buttons slot="start">
                <ion-button data-action="back">
                    <ion-icon slot="start" name="chevron-back-outline"></ion-icon>
                    Back
                </ion-button>
            </ion-buttons>
            <ion-title>
                <span style="display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;">
                    <img id="project-logo" alt="" width="32" height="32" style="border-radius:50%;object-fit:cover;">
                    <span id="project-name"></span>
                </span>
            </ion-title>
            <ion-buttons slot="end">
                <ion-button data-action="exit">
                    <ion-icon slot="start" name="power-outline"></ion-icon>
                    Exit
                </ion-button>
            </ion-buttons>
        </ion-toolbar>
    </ion-header>

    <ion-content class="formbuilder-content">
        <div class="warning-well screen-resolution">
            <p>The formbuilder does not support the current screen resolution</p>
            <p>Please use a screen with a resolution of at least 1024x768</p>
        </div>

        <div class="builder"
             id="builder"
             hidden>
            <section class="builder__tools"
                     id="tools"
                     aria-label="Question types"></section>

            <section class="builder__workspace">
                <div class="builder__forms-row">
                    <nav class="builder__forms"
                         id="form-tabs"
                         role="tablist"
                         aria-label="Forms">
                        <ion-segment class="builder__forms-segment"
                                     value="0"
                                     scrollable="true"></ion-segment>
                    </nav>

                    <button type="button"
                            class="builder__add-form"
                            id="add-form">
                        <ion-icon name="add-outline"
                                  aria-hidden="true"></ion-icon>
                        <span>Add form</span>
                    </button>

                    <div class="builder__form-actions">
                        <button type="button"
                                class="builder__action"
                                id="undo"
                                title="Undo is not ported yet"
                                disabled>
                            <ion-icon name="arrow-undo-outline"
                                      aria-hidden="true"></ion-icon>
                            <span>Undo</span>
                        </button>
                        <button type="button"
                                class="builder__action"
                                id="save"
                                title="Save is not ported yet"
                                disabled>
                            <ion-icon name="save-outline"
                                      aria-hidden="true"></ion-icon>
                            <span>Save project</span>
                        </button>
                    </div>
                </div>

                <div class="builder__columns">
                    <section class="builder__questions"
                             id="questions"
                             aria-label="Questions"></section>
                    <section class="builder__properties"
                             id="properties"
                             aria-label="Question properties"></section>
                </div>
            </section>
        </div>
    </ion-content>
</ion-app>

<!-- jQuery 4 and jQuery UI 1.14, copied from node_modules by the build. -->
<script src="vendor/jquery.min.js"
        defer></script>
<script src="vendor/jquery-ui.min.js"
        defer></script>
<script src="js/formbuilder-ionic.js"
        defer></script>

</body>

</html>
