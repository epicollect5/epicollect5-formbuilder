<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Formbuilder — Ionic</title>
    <meta name="description"
          content="Ionic formbuilder for the Epicollect5 project definition">

    <link rel="shortcut icon"
          href="favicons/favicon.ico">
    <link rel="icon"
          type="image/svg+xml"
          href="favicons/favicon.svg">
    <link rel="apple-touch-icon"
          sizes="96x96"
          href="favicons/favicon-96x96.png">

    <link href="https://fonts.googleapis.com/css?family=Arimo"
          rel="stylesheet"
          type="text/css">

    <!-- Ionic Core 8.8.4 (pinned, copied into vendor/ionic by the build) -->
    <link rel="stylesheet"
          href="vendor/ionic/css/ionic.bundle.css">

    <link rel="stylesheet"
          href="css/ionic-formbuilder.css">
</head>

<body class="loader-background">
<ion-app>
    <div class="loader">Loading...</div>

    <ion-header class="ion-no-border">
        <ion-toolbar class="formbuilder-toolbar">
            <div class="builder-bar">
                <span class="builder-bar__project"
                      id="project-name"></span>
            </div>
        </ion-toolbar>
    </ion-header>

    <ion-content class="formbuilder-content">
        <div class="warning-well screen-resolution">
            <p>The formbuilder does not support the current screen resolution</p>
            <p>Please use a screen with a resolution of at least 1024x768</p>
        </div>

        <div class="builder"
             id="builder"
             hidden>
            <section class="builder__tools"
                     id="tools"
                     aria-label="Question types"></section>

            <section class="builder__workspace">
                <nav class="builder__forms"
                     id="form-tabs"
                     role="tablist"
                     aria-label="Forms"></nav>

                <div class="builder__columns">
                    <section class="builder__questions"
                             id="questions"
                             aria-label="Questions"></section>
                    <section class="builder__properties"
                             id="properties"
                             aria-label="Question properties"></section>
                </div>
            </section>
        </div>
    </ion-content>
</ion-app>

<script src="js/formbuilder-ionic.js"
        defer></script>

</body>

</html>
