<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Formbuilder — Ionic</title>
    <meta name="description"
          content="Ionic formbuilder for the Epicollect5 project definition">

    <link rel="shortcut icon"
          href="favicons/favicon.ico">
    <link rel="icon"
          type="image/svg+xml"
          href="favicons/favicon.svg">
    <link rel="apple-touch-icon"
          sizes="96x96"
          href="favicons/favicon-96x96.png">

    <link href="https://fonts.googleapis.com/css?family=Arimo"
          rel="stylesheet"
          type="text/css">

    <!-- Ionic Core 8.8.4 (pinned, copied into vendor/ionic by the build) -->
    <link rel="stylesheet"
          href="vendor/ionic/css/ionic.bundle.css">

    <link rel="stylesheet"
          href="css/ionic-formbuilder.css">
</head>

<body class="loader-background">
<ion-app>
    <div class="loader">Loading...</div>

    <ion-header class="ion-no-border">
        <ion-toolbar class="formbuilder-toolbar">
            <div class="builder-bar">
                <button type="button"
                        class="builder-bar__link"
                        data-action="back"
                        aria-label="Back to project">
                    <ion-icon name="chevron-back-outline"
                              aria-hidden="true"></ion-icon>
                    <span>Back</span>
                </button>

                <span class="builder-bar__project"
                      id="project-name">
                    <img class="builder-bar__logo"
                         id="project-logo"
                         alt=""
                         width="32"
                         height="32">
                    <span class="builder-bar__project-name"></span>
                </span>

                <button type="button"
                        class="builder-bar__link"
                        data-action="exit"
                        aria-label="Exit the formbuilder">
                    <ion-icon name="power-outline"
                              aria-hidden="true"></ion-icon>
                    <span>Exit</span>
                </button>
            </div>
        </ion-toolbar>
    </ion-header>

    <ion-content class="formbuilder-content">
        <div class="warning-well screen-resolution">
            <p>The formbuilder does not support the current screen resolution</p>
            <p>Please use a screen with a resolution of at least 1024x768</p>
        </div>

        <div class="builder"
             id="builder"
             hidden>
            <section class="builder__tools"
                     id="tools"
                     aria-label="Question types"></section>

            <section class="builder__workspace">
                <div class="builder__forms-row">
                    <nav class="builder__forms"
                         id="form-tabs"
                         role="tablist"
                         aria-label="Forms"></nav>

                    <button type="button"
                            class="builder__add-form"
                            id="add-form">
                        <ion-icon name="add-outline"
                                  aria-hidden="true"></ion-icon>
                        <span>Add form</span>
                    </button>

                    <div class="builder__form-actions">
                        <button type="button"
                                class="builder__action"
                                id="undo"
                                title="Undo is not ported yet"
                                disabled>
                            <ion-icon name="arrow-undo-outline"
                                      aria-hidden="true"></ion-icon>
                            <span>Undo</span>
                        </button>
                        <button type="button"
                                class="builder__action"
                                id="save"
                                title="Save is not ported yet"
                                disabled>
                            <ion-icon name="save-outline"
                                      aria-hidden="true"></ion-icon>
                            <span>Save project</span>
                        </button>
                    </div>
                </div>

                <div class="builder__columns">
                    <section class="builder__questions"
                             id="questions"
                             aria-label="Questions"></section>
                    <section class="builder__properties"
                             id="properties"
                             aria-label="Question properties"></section>
                </div>
            </section>
        </div>
    </ion-content>
</ion-app>

<!-- jQuery UI is the drag-and-drop layer, as in the legacy builder. -->
<script src="https://code.jquery.com/jquery-2.2.1.min.js"
        integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
        crossorigin="anonymous"></script>
<script src="js/vendor-formbuilder.js"
        defer></script>
<script src="js/formbuilder-ionic.js"
        defer></script>

</body>

</html>
